name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: RLS tests (VJT-013 non-member access denial)
        run: |
          if ! command -v pg_ctl >/dev/null 2>&1 && [ ! -d /usr/lib/postgresql ]; then
            sudo apt-get update -y
            sudo apt-get install -y postgresql
          fi
          bash scripts/test-rls.sh

      - name: RLS tests (VJT-017b LGPD consent log — append-only + histórico)
        run: bash scripts/test-rls.sh --lgpd

      # VJT-020 abriu SELECT público na viagem exemplo. O audit é o que prova
      # que a abertura para `anon` não passou de trips template — inclusive
      # com controle negativo — e ele sai com código != 0 quando não prova.
      # Rodar só à mão deixaria a garantia valendo até o próximo PR mexer numa
      # policy sem ninguém rodar de novo.
      - name: RLS audit (VJT-020 abertura pública — 0 leaks, com controle negativo)
        run: bash scripts/test-rls.sh --audit

      - name: Build
        run: bun run build
